schema_version: 1
repository:
  id: "repo_01KYFBZ4DBDJE4Z769C81WBGBA"
  display_name: "nddev-pi-app"
  roles:
    - "module"
  lifecycle: "archived"
provider:
  type: "github"
  installation: "installation:github-personal"
  repository_id: 1312851892
  owner: "rldyourmnd"
  name: "nddev-pi-app"
  # A transfer keeps the numeric repository id, so this is the same
  # repository under a new locator. The previous one is retained:
  # dropping it would break alias history for anything that resolved
  # the repository by its old path.
  aliases:
    - owner: "NDDev-it-com"
      name: "nddev-pi-app"
classification:
  portfolios:
    - "portfolio:archived-projects"
  visibility_contract: "public"
  data_classification: "public"
policy:
  profiles:
    - "repository-default"
    - "personal-default"
    - "public-module"
  rollout_ring: "canary-modules"
git:
  default_branch: "main"
  integration: "pull-request"
  branch_model: "task-branches"
  handoff_pr: "preferred"
  cleanup: "merged-only"
verification:
  commands:
    test:
      - "python3 -m json.tool config/nddev-contract.json"
  required:
    - "test"
agent:
  context_profile: "public-module"
  generated_agents: true
  serena:
    enabled: false
    provenance_required: false
module:
  contract: "public"
  consumption:
    - "git-submodule"
  compatibility: "semver"
  pin_policy: "default-branch-commit"
  publication:
    registry: "none"
    github_release: "required"
release:
  mode: "github-release"
  tag_style: "semver"
